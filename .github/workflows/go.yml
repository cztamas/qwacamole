name: Portable Go, Caddy and Certbot Nginx integration
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/cztamas/qwacamole
    steps:
      - uses: actions/checkout@v4
      # Go resolves the real core version in its own VCS cache, outside the
      # checkout. Reuse checkout's read-only repository credential there too.
      - name: Scope private module authentication to this repository
        run: git config --global http.https://github.com/cztamas/qwacamole.extraheader "$(git config --get http.https://github.com/.extraheader)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            agent/go.sum
            caddy/go.sum
            devtools/go.sum
      - name: All module race tests (transactions, crash recovery, cache, retention and concurrency)
        run: |
          go test -race ./...
          (cd agent && go test -race ./...)
          (cd caddy && go test -race ./...)
          (cd devtools && go test -race ./...)
      - name: Independently pinned module races (GOWORK=off, no replacements)
        run: GO=go scripts/check-independent-modules.sh
      - name: Dependency boundaries
        run: GO=go scripts/check-boundaries.sh
      - name: Independent dependency security and production command call paths
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          python3 scripts/check-vulnerabilities.py --go go --scanner "$(go env GOPATH)/bin/govulncheck" --output .local/ci-vulnerabilities
      - name: Pinned portable tools and plugin-only binary
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.8.0
          mkdir -p bin .tools/bin
          cp "$(go env GOPATH)/bin/pebble" .tools/bin/pebble
          GOWORK=off xcaddy build v2.11.7 --with github.com/cztamas/qwacamole/caddy@v0.0.0="$PWD/caddy" --replace github.com/cztamas/qwacamole="$PWD" --output bin/caddy-plugin
          (cd devtools && go build -o ../bin/qwacamole ./cmd/qwacamole)
      - name: Nginx package
        timeout-minutes: 5
        run: |
          # The runner mirrorlist selected Azure HTTP for package indexes and
          # stalled despite successful official HTTPS metadata downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y nginx
      - name: Certbot tools
        timeout-minutes: 5
        run: |
          python3 -m venv .tools/certbot-venv
          .tools/certbot-venv/bin/pip install --timeout 30 --retries 1 'certbot==5.8.0'
      - name: Production agent binary
        run: |
          (cd agent && go build -o ../bin/qwacamole-agent ./cmd/qwacamole-agent)
      - name: Ubuntu setup permissions and worker challenge access under restrictive umasks
        run: |
          bin/qwacamole pki -state .local/ci-setup-fixture
          cat .local/ci-setup-fixture/pki/qwac-leaf.pem .local/ci-setup-fixture/pki/qwac-intermediate.pem > .local/ci-setup-fixture/pki/qwac-chain.pem
          docker build --platform linux/amd64 -t qwacamole-setup-acceptance -f devtools/operator-acceptance/Dockerfile .
          python3 devtools/operator-acceptance/run_setup_umask.py \
            --image qwacamole-setup-acceptance --agent bin/qwacamole-agent --caddy bin/caddy-plugin \
            --fixtures .local/ci-setup-fixture/pki --output .local/ci-setup-umask
      - name: Real Nginx WebSocket, slow upload, Certbot lifecycle and fail-closed gate
        run: bin/qwacamole nginx-smoke -state .local/ci-nginx -nginx /usr/sbin/nginx
      - name: Nondefault Nginx body, buffering, inactivity timeout, redirect and HSTS policy
        run: bin/qwacamole nginx-serving-smoke -state .local/ci-nginx-custom -nginx /usr/sbin/nginx
      - name: Install merged-main upgrade baseline from its immutable remote ref
        run: |
          GOWORK=off GOBIN="$PWD/bin" go install github.com/cztamas/qwacamole/agent/cmd/qwacamole-agent@4a93ce6c43bf4a728a69625ac7ed567d54db53f1
          mv bin/qwacamole-agent bin/qwacamole-agent-baseline
          (cd agent && go build -o ../bin/qwacamole-agent ./cmd/qwacamole-agent)
      - name: Real Nginx offline migration, interruption, repeated execution and lifecycle
        run: bin/qwacamole nginx-upgrade-smoke -state .local/ci-nginx-upgrade -nginx /usr/sbin/nginx
      - name: Real ACME multi-site cache, WebSocket, renewal and offline retirement checks
        run: bin/qwacamole plugin-smoke -state .local/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-smoke-evidence
          path: |
            .local/ci-setup-umask/
            .local/ci-vulnerabilities/
            .local/ci/**/evidence/
            .local/ci-nginx/**/evidence/
            .local/ci-nginx-custom/**/evidence/
            .local/ci-nginx-upgrade/**/evidence/
            .local/ci-nginx/**/agent.log
            .local/ci-nginx/**/agent-faults.log
            .local/ci-nginx/**/nginx/error.log
      - name: Remove private module authentication
        if: always()
        run: git config --global --unset-all http.https://github.com/cztamas/qwacamole.extraheader || true

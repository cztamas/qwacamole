name: Agent alpha candidate packages
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/cztamas/qwacamole
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Repository-scoped read credential for private module resolution
        run: git config --global http.https://github.com/cztamas/qwacamole.extraheader "$(git config --get http.https://github.com/.extraheader)"
      - name: Package verifier and publication gate regressions
        run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v
      - name: Build exact source and verify extracted Linux amd64 package
        run: |
          approved=()
          if python3 -c 'import json; assert json.load(open("release/publication.json"))["approved"] is True'; then approved=(--approved); fi
          version=$(python3 -c 'import json; print(json.load(open("release/publication.json"))["version"])')
          python3 scripts/release-agent.py build --source "$(git rev-parse HEAD)" --version "$version" --output candidate --go go "${approved[@]}"
          python3 scripts/release-agent.py verify candidate --smoke --require-native
      - name: Security scan independent modules and every extracted production binary
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          python3 scripts/check-vulnerabilities.py --go go --scanner "$(go env GOPATH)/bin/govulncheck" --output .local/candidate-vulnerabilities --candidate candidate
      - name: Packaged Caddy escaped-path denial regression
        run: python3 scripts/check-caddy-routing.py --directory candidate --output .local/candidate-routing.json
      - name: Retain security evidence including retrieval timestamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .local/candidate-vulnerabilities/
            .local/candidate-routing.json
          if-no-files-found: warn
      - name: Retain candidates for review (no publishing permission)
        uses: actions/upload-artifact@v4
        with:
          name: agent-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Remove private module credential
        if: always()
        run: git config --global --unset-all http.https://github.com/cztamas/qwacamole.extraheader || true
  macos-package:
    needs: packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: agent-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/
      - name: Verify extracted macOS arm64 package
        run: python3 scripts/release-agent.py verify candidate --smoke --require-native
